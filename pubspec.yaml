name: unibuddy
description: UniBuddy - All-in-One Student Management & Study Tracker App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.14.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0

  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  http: ^1.6.0

  syncfusion_flutter_pdfviewer: ^32.1.19
  open_filex: ^4.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/study_student.png